# KMS-OPS 双系统并存部署配置
# 支持 kms-generate 和 kms-updatedel 两系统同时运行

services:
  # ========================================
  # 1. 共享中间件 (基础设施层)
  # ========================================
  mysql:
    image: mysql:8.0
    container_name: kms_mysql
    environment:
      - "MYSQL_ROOT_PASSWORD=root"
      - "MYSQL_DATABASE=ry_vue"
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/my.cnf:/etc/mysql/my.cnf
    restart: always
    networks:
      - kms_net

  redis:
    image: redis:6.2
    container_name: kms_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - ./redis/data:/data
    restart: always
    networks:
      - kms_net

  kafka:
    image: apache/kafka:latest
    container_name: kms_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - ./kafka/kafka_data:/var/lib/kafka/data
    restart: always
    networks:
      - kms_net
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  fisco-node:
    image: ubuntu:22.04
    container_name: kms_fisco
    dns:
      - 8.8.8.8
    volumes:
      - ./fisco/nodes/127.0.0.1:/data
    working_dir: /data/node0
    command: bash -c "chmod +x /data/fisco-bcos && /data/fisco-bcos -c config.ini"
    ports:
      - "20200:20200"
      - "8545:8545"
    restart: always
    networks:
      - kms_net

  # ========================================
  # 2. kms-generate 系统 (密钥生成)
  # ========================================
  generate-go:
    image: ubuntu:22.04
    container_name: kms_generate_go
    volumes:
      - ./kms-generate/go-backend:/app
    working_dir: /app
    command: sh -c "chmod +x ./key-service && ./key-service"
    ports:
      - "8081:8081"
    environment:
      - KAFKA_HOST=kafka
      - GOGC=500
    depends_on:
      kafka:
        condition: service_started
    restart: always
    networks:
      - kms_net

  generate-java:
    image: eclipse-temurin:8-jdk
    container_name: kms_generate_java
    volumes:
      - ./kms-generate/java-backend:/app
    working_dir: /app
    command: java -jar ruoyi-admin.jar
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - KAFKA_HOST=kafka
      - FISCO_HOST=fisco-node
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      fisco-node:
        condition: service_started
    restart: always
    networks:
      - kms_net

  # ========================================
  # 3. kms-updatedel 系统 (密钥更新与回收)
  # ========================================
  updatedel-go:
    image: ubuntu:22.04
    container_name: kms_updatedel_go
    volumes:
      - ./kms-updatedel/go-backend:/app
    working_dir: /app
    command: sh -c "chmod +x ./key-service && ./key-service"
    ports:
      - "8082:8082"
    environment:
      - KAFKA_HOST=kafka
      - GOGC=500
    depends_on:
      kafka:
        condition: service_started
    restart: always
    networks:
      - kms_net

  updatedel-java:
    image: eclipse-temurin:8-jdk
    container_name: kms_updatedel_java
    volumes:
      - ./kms-updatedel/java-backend:/app
    working_dir: /app
    command: java -jar ruoyi-admin.jar
    ports:
      - "8083:8080"
    environment:
      - DB_HOST=mysql
      - KAFKA_HOST=kafka
      - FISCO_HOST=fisco-node
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      fisco-node:
        condition: service_started
    restart: always
    networks:
      - kms_net

  # ========================================
  # 4. 网关层 (Nginx)
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: kms_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
      - ./front/generate:/usr/share/nginx/html/generate
      - ./front/updatedel:/usr/share/nginx/html/lifecycle
    depends_on:
      - generate-go
      - generate-java
      - updatedel-go
      - updatedel-java
    restart: always
    networks:
      - kms_net

networks:
  kms_net:
    driver: bridge
