# KMS-OPS 双系统并存部署配置
# 支持 kms-generate 和 kms-updatedel 两系统同时运行

services:
  # ========================================
  # 1. 共享中间件 (基础设施层)
  # ========================================
  mysql:
    image: mysql:8.0
    container_name: kms_mysql
    environment:
      - "MYSQL_ROOT_PASSWORD=root123456"
      - "MYSQL_DATABASE=kms"
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/my.cnf:/etc/mysql/my.cnf
    restart: always
    networks:
      - kms_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:6.2
    container_name: kms_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - ./redis/data:/data
    restart: always
    networks:
      - kms_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:latest
    container_name: kms_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - ./kafka/kafka_data:/var/lib/kafka/data
    restart: always
    networks:
      - kms_net
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  fisco-node:
    image: ubuntu:22.04
    container_name: kms_fisco
    dns:
      - 8.8.8.8
    volumes:
      - ./fisco/nodes/127.0.0.1:/data
    working_dir: /data/node0
    command: bash -c "chmod +x /data/fisco-bcos && /data/fisco-bcos -c config.ini"
    ports:
      - "20200:20200"
      - "8545:8545"
    restart: always
    networks:
      - kms_net

  fisco-console:
    image: eclipse-temurin:8-jre
    container_name: kms_fisco_console
    volumes:
      - ./fisco/console:/app
      - ./fisco/console/conf:/app/conf
    working_dir: /app
    command: ["bash", "-lc", "chmod +x /app/*.sh && sleep infinity"]
    depends_on:
      fisco-node:
        condition: service_started
    restart: always
    networks:
      - kms_net

  # ========================================
  # 2. kms-generate 系统 (密钥生成)
  # ========================================
  generate-go:
    image: debian:bookworm-slim
    container_name: kms_generate_go
    volumes:
      - ./runtime/generate-go/kms-generate-service:/app/kms-generate-service:ro
    working_dir: /app
    command: ["/app/kms-generate-service"]
    ports:
      - "8081:8081"
    environment:
      - KAFKA_ADDR=kafka:9092
      - KAFKA_TOPIC=key_generate_log
      - JAVA_BACKEND_BASE=http://generate-java:9081
      - SERVER_PORT=8081
      - GOGC=500
    depends_on:
      kafka:
        condition: service_started
    restart: always
    networks:
      - kms_net

  generate-java:
    image: eclipse-temurin:8-jre
    container_name: kms_generate_java
    volumes:
      - ./runtime/generate-java/kms-generate.jar:/app/kms-generate.jar:ro
      - ./runtime/generate-java/config-fisco.toml:/app/config-fisco.toml:ro
      - ./fisco/console/conf:/app/conf:ro
    working_dir: /app
    command: ["java", "-jar", "/app/kms-generate.jar"]
    ports:
      - "9081:9081"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=kms
      - DB_USERNAME=root
      - DB_PASSWORD=root123456
      - GO_BACKEND_URL=http://generate-go:8081
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - FISCO_HOST=fisco-node
      - FISCO_CONTRACT_ADDRESS=${FISCO_CONTRACT_ADDRESS:-0x0000000000000000000000000000000000000000}
      - FISCO_PRIVATE_KEY=${FISCO_PRIVATE_KEY:-}
      - KMS_CHAIN_RESULT_TOPIC=${KMS_CHAIN_RESULT_TOPIC:-key_chain_result}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      fisco-node:
        condition: service_started
      fisco-console:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always
    networks:
      - kms_net

  # ========================================
  # 3. kms-updatedel 系统 (密钥更新与回收)
  # ========================================
  updatedel-go:
    image: debian:bookworm-slim
    container_name: kms_updatedel_go
    volumes:
      - ./runtime/updatedel-go/kms-updatedel-service:/app/kms-updatedel-service:ro
    working_dir: /app
    command: ["/app/kms-updatedel-service"]
    ports:
      - "8082:8082"
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_UPDATE_TOPIC=key_update_log
      - KAFKA_REVOKE_TOPIC=key_revoke_log
      - REDIS_ADDR=redis:6379
      - SERVER_PORT=8082
      - GOGC=500
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always
    networks:
      - kms_net

  updatedel-java:
    image: eclipse-temurin:8-jre
    container_name: kms_updatedel_java
    volumes:
      - ./runtime/updatedel-java/kms-updatedel.jar:/app/kms-updatedel.jar:ro
      - ./runtime/updatedel-java/config-fisco.toml:/app/config-fisco.toml:ro
      - ./fisco/console/conf:/app/conf:ro
    working_dir: /app
    command: ["java", "-jar", "/app/kms-updatedel.jar"]
    ports:
      - "9082:9082"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=kms
      - DB_USERNAME=root
      - DB_PASSWORD=root123456
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - FISCO_HOST=fisco-node
      - FISCO_CONTRACT_ADDRESS=${FISCO_CONTRACT_ADDRESS:-0x0000000000000000000000000000000000000000}
      - FISCO_PRIVATE_KEY=${FISCO_PRIVATE_KEY:-}
      - KMS_CHAIN_RESULT_TOPIC=${KMS_CHAIN_RESULT_TOPIC:-key_chain_result}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      fisco-node:
        condition: service_started
      fisco-console:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always
    networks:
      - kms_net

  # ========================================
  # 4. kms-distribute 系统 (密钥分发)
  # ========================================
  kms-distribute:
    image: eclipse-temurin:8-jre
    container_name: kms_distribute_java
    volumes:
      - ./runtime/distribute-java/kms-distribute.jar:/app/kms-distribute.jar:ro
    working_dir: /app
    command: ["java", "-jar", "/app/kms-distribute.jar"]
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=kms
      - DB_USERNAME=root
      - DB_PASSWORD=root123456
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KMS_CHAIN_RESULT_TOPIC=${KMS_CHAIN_RESULT_TOPIC:-key_chain_result}
      - FISCO_HOST=fisco-node
      - FISCO_CONTRACT_ADDRESS=${FISCO_CONTRACT_ADDRESS:-0x0000000000000000000000000000000000000000}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      fisco-node:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always
    networks:
      - kms_net

  # ========================================
  # 5. kms-acceptance 系统 (验收与联调)
  # ========================================
  acceptance-backend:
    image: debian:bookworm-slim
    container_name: kms_acceptance_backend
    volumes:
      - ./runtime/acceptance-go/kms-acceptance-backend:/app/kms-acceptance-backend:ro
      - ./wrk:/app/wrk:ro
    working_dir: /app
    command: ["/app/kms-acceptance-backend"]
    environment:
      - PORT=9090
      - WRK_PATH=/app/wrk/wrk
      - ACCEPTANCE_GENERATE_BASE_URL=http://generate-go:8081
      - ACCEPTANCE_LIFECYCLE_BASE_URL=http://updatedel-go:8082
    depends_on:
      - generate-go
      - updatedel-go
    restart: always
    networks:
      - kms_net

  # ========================================
  # 6. 网关层 (Nginx)
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: kms_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
      - ./front/portal:/usr/share/nginx/html
      - ./front/generate:/usr/share/nginx/html/generate
      - ./front/updatedel:/usr/share/nginx/html/updatedel
      - ./front/distribute:/usr/share/nginx/html/distribute
      - ./front/user:/usr/share/nginx/html/user
      - ./front/acceptance:/usr/share/nginx/html/acceptance
    depends_on:
      - generate-go
      - generate-java
      - updatedel-go
      - updatedel-java
      - kms-distribute
      - acceptance-backend
    restart: always
    networks:
      - kms_net

networks:
  kms_net:
    driver: bridge
