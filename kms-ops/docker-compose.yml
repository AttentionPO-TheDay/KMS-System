services:
  # -----------------------
  # 1. 区块链服务 (直接运行，假设数据已存在)
  # -----------------------
  fisco-node:
    image: ubuntu:22.04
    container_name: fisco_node0
    dns:
      - 8.8.8.8
    volumes:
      # 挂载父目录
      - ./fisco/nodes/127.0.0.1:/data
    
    working_dir: /data/node0
    
    command: >
      bash -c "chmod +x /data/fisco-bcos && \
      /data/fisco-bcos -c config.ini"
      
    ports:
      - "20200:20200"
      - "8545:8545"
    restart: always
    networks:
      - app_net
  # -----------------------
  # 2. 基础设施 (MySQL, Redis, Kafka) - 保持不变
  # -----------------------
  mysql:
    image: mysql:8.0
    container_name: mysql_server
    environment:
      - "MYSQL_ROOT_PASSWORD=root"
      - "MYSQL_DATABASE=ry_vue"
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/my.cnf:/etc/mysql/my.cnf
    restart: always
    networks:
      - app_net

  redis:
    image: redis:6.2
    container_name: redis_server
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - ./redis/data:/data
    restart: always
    networks:
      - app_net

  kafka:
    image: apache/kafka:latest
    container_name: kafka_server
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - ./kafka/kafka_data:/var/lib/kafka/data
    restart: always
    networks:
      - app_net
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  # -----------------------
  # 3. 业务后端 (Console 已移除)
  # -----------------------
  java-app:
    image: eclipse-temurin:8-jdk
    container_name: java_backend
    volumes:
      - ./kms-java-backend:/app
    working_dir: /app
    command: java -jar ruoyi-admin.jar
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - KAFKA_HOST=kafka
      - FISCO_HOST=fisco-node
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
      fisco-node:
        condition: service_started
    restart: always
    networks:
      - app_net

  go-app:
    image: ubuntu:22.04
    container_name: go_backend
    volumes:
      - ./kms-go-backend:/app
    working_dir: /app
    command: sh -c "chmod +x ./key-service && ./key-service"
    ports:
      - "8081:8081"
    environment:
      - KAFKA_HOST=kafka
      - GOGC=500
    depends_on:
      kafka:
        condition: service_started
    restart: always
    networks:
      - app_net

  # -----------------------
  # 4. 前端与网关
  # -----------------------
  nginx:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
      - ./front/dist:/usr/share/nginx/html
    depends_on:
      java-app:
        condition: service_started
      go-app:
        condition: service_started
    restart: always
    networks:
      - app_net

networks:
  app_net:
    driver: bridge