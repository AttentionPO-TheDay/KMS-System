services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    # 【性能关键】Linux下必须使用host模式，Windows/Mac下请改为 ports 映射
    network_mode: "host"
    environment:
      # --- KRaft 核心配置 ---
      # 节点 ID
      KAFKA_NODE_ID: 1
      # 角色：既是 Broker 也是 Controller
      KAFKA_PROCESS_ROLES: broker,controller
      # 监听器名称定义
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 监听器安全协议
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Controller 监听器名称
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 告诉外部如何连接 (宿主机 IP)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      # Controller 仲裁连接串
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      # --- 【关键修复】单机模式必须加这三行 ---
      # 1. 默认副本数设为 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # 2. 事务状态日志副本数设为 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # 3. 事务状态日志最小 ISR 设为 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # --- 数据目录 ---
      # 官方镜像通常不需要显式指定 log.dirs，挂载 /var/lib/kafka/data 即可
      
      # --- 【10万 TPS 核心性能调优】 ---
      # 1. 默认分区数：6 (配合 Java 多线程消费)
      KAFKA_NUM_PARTITIONS: 6
      
      # 2. 线程池调优 (针对 10W TPS 的海量请求)
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_NUM_IO_THREADS: 16
      
      # 3. 缓冲区调优 (1MB)
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      
      # 4. 刷盘策略 (利用 OS PageCache)
      # 保持默认，不要设置 log.flush.interval.messages=1，否则性能会跌到谷底
      
      # 5. JVM 堆内存设置 (官方镜像通过这个变量设置)
      # 这里给 1G 到 2G 足够了，剩下的留给操作系统做文件缓存
      KAFKA_HEAP_OPTS: "-Xmx2g -Xms2g"
      
      # 6. 日志保留时间 (24小时)
      KAFKA_LOG_RETENTION_HOURS: 24
      
      # 7. 自动创建 Topic (为了方便测试，生产环境建议 false)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      # 挂载数据盘
      - ./kafka_data:/var/lib/kafka/data
    
    # 提高文件句柄限制
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    restart: always