# =============================================================================
# docker-compose.debug-ports.yml —— 本机调试用的**覆盖文件**（不要用于部署）
# -----------------------------------------------------------------------------
# 为什么会有这个文件（2026-09-24）：
#   默认 compose 里，Go 入站层（8081/8082）、Java 业务层（9081/9082）与
#   dvadmin（8001）**都不再发布到宿主机**。理由有两条：
#     1) 部署环境不允许占用这些端口（远端实测 8081 address already in use），
#        而它们本来就只需要 Docker 内网可达 —— 网关和验收容器都按**服务名**访问；
#     2) 少发布一个端口就少一份暴露面：Go 入站层的身份来自 Java 写入的
#        X-Kms-User 内部头，dvadmin 的演示接口没有鉴权，都不该对外。
#
#   但宿主机上的调试脚本（kms-ops/check.ps1、kms-ops/tests/*_load_test.sh、
#   tools/verify-pa-target.mjs）习惯直连 127.0.0.1:8081 这类地址。
#   那些脚本要用时，就在本机加上这个覆盖文件：
#
#     docker compose -f docker-compose.yml -f docker-compose.debug-ports.yml up -d
#
#   只绑回环（127.0.0.1），即使在本机也不会对局域网暴露。
# =============================================================================
services:
  generate-go:
    ports:
      - "127.0.0.1:8081:8081"
  updatedel-go:
    ports:
      - "127.0.0.1:8082:8082"
  generate-java:
    ports:
      - "127.0.0.1:9081:9081"
  updatedel-java:
    ports:
      - "127.0.0.1:9082:9082"
  dvadmin3-django:
    ports:
      - "127.0.0.1:8001:8000"
