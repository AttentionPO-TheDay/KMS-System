version: '3'

services:

  # -----------------------
  # 0. 初始化服务（一次性，造车）
  # -----------------------
  chain-setup:
    image: debian:bullseye-slim
    container_name: chain_setup
    entrypoint: 
      - /bin/bash
      - -c 
      - |
        apt-get update && \
        apt-get install -y --no-install-recommends curl openssl ca-certificates && \
        bash /scripts/init-fisco.sh
    volumes:
      # 1. 挂载初始化脚本
      - ./scripts/init-fisco.sh:/scripts/init-fisco.sh
      # 2. 挂载数据目录 (脚本会往这里写文件)
      - ./fisco:/data
      # 3. 挂载 Java 证书目标目录 (脚本会把证书分发到这里)
      - ./kms-java-backend/conf:/java-shared-certs
    # 运行完就退出，不重启
    restart: "no"
    networks:
      - app_net

  # -----------------------
  # 1. 区块链服务 
  # -----------------------
  fisco-node:
    image: debian:bullseye-slim
    container_name: fisco_node0
    # 必须等 setup 完成
    depends_on:
      chain-setup:
        condition: service_completed_successfully
    volumes:
      # 读取 setup 下载并生成的节点数据
      - ./fisco/nodes/127.0.0.1/node0:/data
    working_dir: /data
    command: >
      bash -c "apt-get update && \
      apt-get install -y --no-install-recommends openssl libssl-dev && \
      chmod +x /data/fisco-bcos && \
      /data/fisco-bcos -c config.ini"
    ports:
      # 宿主机端口映射
      - "20200:20200"
      - "8545:8545"
    restart: always
    networks:
      - app_net

  # ==========================================
  # 2. 命令行/编译工具 (Console)
  # ==========================================
  console:
    image: openjdk:8-jdk-slim
    container_name: fisco_console
    # 执行自动编译脚本
    entrypoint: ["bash", "/dist/contracts/solidity/auto-compile.sh"]
    volumes:
      - ./fisco/console:/dist/console
      - ./fisco/contracts:/dist/contracts/solidity
      - ./fisco/contracts/compiled:/dist/contracts/compiled
    
    networks:
      - app_net


  # -----------------------
  # 3. 基础设施服务 (MySQL, Redis, Kafka)
  # -----------------------
  mysql:
    image: mysql:8.0
    container_name: mysql_server
    environment:
      - "MYSQL_ROOT_PASSWORD=root"
      - "MYSQL_DATABASE=ry_vue"
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/my.cnf:/etc/mysql/my.cnf
    restart: always
    networks:
      - app_net

  redis:
    image: redis:6.2
    container_name: redis_server
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - ./redis/data:/data
    restart: always
    networks:
      - app_net

  kafka:
    image: apache/kafka:latest
    container_name: kafka_server
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - ./kafka/kafka_data:/var/lib/kafka/data
    restart: always
    networks:
      - app_net


  # -----------------------
  # 4. 业务后端 (Java & Go)
  # -----------------------
  java-app:
    image: openjdk:8-jdk-slim
    container_name: java_backend
    volumes:
      - ./kms-java-backend:/app
      # 挂载编译好的合约 Java 文件
      - ./fisco/contracts/compiled:/app/contracts
    working_dir: /app
    command: java -jar ruoyi-admin.jar
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - KAFKA_HOST=kafka
      - FISCO_HOST=fisco-node
    depends_on:
      - mysql
      - kafka
      - fisco-node
      - console
    networks:
      - app_net

  go-app:
    image: alpine:latest
    container_name: go_backend
    volumes:
      - ./kms-go-backend:/app
    working_dir: /app
    command: ./key-service
    ports:
      - "8081:8081"
    environment:
      - KAFKA_HOST=kafka
    depends_on:
      - kafka
    networks:
      - app_net

  # -----------------------
  # 5. 前端与网关 (Nginx)
  # -----------------------
  nginx:
    image: nginx:alpine
    container_name: gateway
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
      - ./front/dist:/usr/share/nginx/html
    depends_on:
      - java-app
      - go-app
    networks:
      - app_net

  # -----------------------
  # 6. 测试工具 (JMeter)
  # -----------------------
  jmeter:
    image: justb4/jmeter:latest
    container_name: jmeter_runner
    volumes:
      - ./jmeter/tests:/tests
      - ./jmeter/results:/results
    command: -n -t /tests/test_plan.jmx -l /results/result.jtl -e -o /results/report
    networks:
      - app_net
    profiles:
      - tools 
    links:
      - nginx:localhost

networks:
  app_net:
    driver: bridge