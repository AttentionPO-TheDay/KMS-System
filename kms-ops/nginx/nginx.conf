# KMS-OPS 双系统 Nginx 网关配置
# 路由规则:
#   /generate-ingress/* -> generate-go:8081
#   /generate-api/*     -> generate-java:9081
#   /lifecycle-ingress/* -> updatedel-go:8082
#   /lifecycle-api/*    -> updatedel-java:9082
#   /generate/*         -> generate-front:80
#   /lifecycle/*        -> updatedel-front:80

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 100000;

events {
    worker_connections  20480;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 关闭访问日志以提升 I/O 性能
    access_log  off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # ========== Upstream 定义 ==========
    # kms-generate 后端
    upstream generate_go_backend {
        server generate-go:8081;
        keepalive 1000;
    }

    upstream generate_java_backend {
        server generate-java:9081;
        keepalive 32;
    }

    # kms-updatedel 后端
    upstream updatedel_go_backend {
        server updatedel-go:8082;
        keepalive 1000;
    }

    upstream updatedel_java_backend {
        server updatedel-java:9082;
        keepalive 32;
    }

    # ========== Server 定义 ==========
    server {
        listen       80;
        server_name  localhost;

        # 安全响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;

        # ========== kms-generate 路由 ==========
        # Go 后端入口
        location /generate-ingress/ {
            proxy_pass http://generate_go_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
        }

        # Java 后端 API
        location /generate-api/ {
            proxy_pass http://generate_java_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 前端页面
        location /generate/ {
            alias /usr/share/nginx/html/generate/;
            try_files $uri $uri/ /generate/index.html;
            index index.html index.htm;
        }

        # ========== kms-updatedel 路由 ==========
        # Go 后端入口
        location /lifecycle-ingress/ {
            proxy_pass http://updatedel_go_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
        }

        # Java 后端 API
        location /lifecycle-api/ {
            proxy_pass http://updatedel_java_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 前端页面
        location /lifecycle/ {
            alias /usr/share/nginx/html/lifecycle/;
            try_files $uri $uri/ /lifecycle/index.html;
            index index.html index.htm;
        }

        # ========== 默认路由 (健康检查) ==========
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index index.html index.htm;
        }

        location /ping {
            return 200 "KMS Gateway OK";
            add_header Content-Type text/plain;
        }
    }
}
