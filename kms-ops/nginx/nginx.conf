# KMS gateway: one controlled demo product on every published listener.
# Go generation/lifecycle ingress and all /internal paths remain private.
user nginx;
worker_processes auto;
worker_rlimit_nofile 100000;

events {
    worker_connections 20480;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Empty keys bypass accounting: polling/acceptance load tests are unaffected.
    map "$request_method:$uri" $kms_node_crypto_probe {
        default "";
        ~^POST:/(?:pqkds-api/(?:pqkds/)?|demo-api/pqkds/)node-self/(?:distributions/|envelopes/[0-9]+/(?:verify|recover|sign)/|sessions/[^/]+/confirm/)$ $binary_remote_addr;
    }
    limit_req_zone $kms_node_crypto_probe zone=kms_node_crypto:10m rate=10r/s;

    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Do not enable gzip_static: stale precompressed HTML can load retired chunks.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
        application/json application/xml application/xml+rss application/wasm
        image/svg+xml font/woff font/woff2;

    upstream generate_java_backend {
        zone generate_java_backend 64k;
        server generate-java:9081 resolve;
        keepalive 32;
    }
    upstream updatedel_java_backend {
        zone updatedel_java_backend 64k;
        server updatedel-java:9082 resolve;
        keepalive 32;
    }
    upstream pqkds_demo_backend {
        zone pqkds_demo_backend 64k;
        server dvadmin3-django:8000 resolve;
        keepalive 32;
    }
    upstream acceptance_backend {
        zone acceptance_backend 64k;
        server acceptance-backend:9090 resolve;
        keepalive 16;
    }

    # Generated at entrypoint. Disabled/missing credentials fail closed on all ports.
    # HTTP8088 retains its original IndexedDB origin; TLS shares the same locations.
    include /etc/nginx/kms-demo.conf;
}
