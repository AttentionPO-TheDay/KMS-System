# KMS-OPS 双系统 Nginx 网关配置
# 路由规则:
#   /generate-api/*     -> generate-java:9081
#   /updatedel-api/*    -> updatedel-java:9082
#   /lifecycle-api/*    -> updatedel-java:9082
#   /updatedel/*        -> 静态前端
#   /distribute/*       -> 静态前端
#   /distribute-api/*   -> kms-distribute:8083（kms-user 分发记录查询）
#   /pqkds-api/*        -> dvadmin3-django:8000
#   /user/*             -> kms-user 静态前端
#   /acceptance/*       -> kms-acceptance 静态前端
#   /acceptance-api/*   -> acceptance-backend:9090
#
# 已下线: /generate/ 静态前端（遗留重复应用，页面已并入统一管理端 /updatedel/，
#         见 kms-generate/front/RETIRED.md）。/generate-api/ 路由与 generate 后端不受影响。
#
# 安全说明: generate-go:8081 / updatedel-go:8082 的入站接口不对外暴露，
#          仅由 Java 业务层经 Docker 内网调用（身份经 X-Kms-User 内部头传递）。
#
# ===========================================================================
# 前端缓存策略（重要，勿随意改动）
# ===========================================================================
# 事故背景: 原先只有 /distribute/ 配了 no-cache，其余 4 个应用入口 index.html
#   既无 Cache-Control 也无 Expires。此时浏览器启用「启发式缓存」——
#   按 (now - Last-Modified) 的 10% 估算新鲜期，这些文件 Last-Modified 较旧，
#   于是浏览器数小时内直接复用磁盘缓存、不再回源校验。
#   后果: 发版后浏览器仍加载旧 index.html，旧 HTML 引用的是已被删除的旧 chunk
#   哈希；该请求落到 SPA fallback 又返回 index.html（HTTP 200 text/html），
#   最终报 "Expected a JavaScript-or-Wasm module script but the server responded
#   with a MIME type of text/html"，且所有懒加载路由整片 404。
#
# 现行策略:
#   1. 入口 HTML —— 一律 no-store，永不使用缓存副本。
#   2. 哈希资源 —— Vite/webpack 产物名含内容哈希，内容与文件名一一对应，
#      用 max-age=31536000 + immutable 强缓存，命中后连校验请求都省掉。
#   3. 缺失资源 —— /assets/ 下找不到的文件直接 404，绝不回落 index.html，
#      避免「HTML 冒充 JS」把问题掩盖成 MIME 报错。
# ===========================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 100000;

events {
    worker_connections  20480;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # 关闭访问日志以提升 I/O 性能
    access_log  off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # ========== 压缩 ==========
    # 前端产物（Element Plus / ECharts 打包后单文件可达数百 KB）必须压缩传输。
    # 刻意不开 gzip_static：产物目录里存在 index.html.gz，一旦它与 index.html
    # 不同步，就会重演「入口 HTML 陈旧」这类事故，省下的那点 CPU 不值得。
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # ========== Upstream 定义 ==========
    # kms-generate 后端（Go 入站层不对外暴露，无 upstream）
    upstream generate_java_backend {
        zone generate_java_backend 64k;
        server generate-java:9081 resolve;
        keepalive 32;
    }

    # kms-updatedel 后端（Go 入站层不对外暴露，无 upstream）
    upstream updatedel_java_backend {
        zone updatedel_java_backend 64k;
        server updatedel-java:9082 resolve;
        keepalive 32;
    }

    upstream pqkds_demo_backend {
        zone pqkds_demo_backend 64k;
        server dvadmin3-django:8000 resolve;
        keepalive 32;
    }

    # 旧分发 Java 后端（8083）的 upstream 已随 P5 删除。
    #
    # 它曾为 kms-user 的 /distribute 页面提供分发记录查询（`kms.key_distribute_record`）。
    # 三个消费方已迁到新批次表，路由现对 /distribute-api/ 显式返回 404，故 upstream 无引用方。
    #
    # 留这段说明而不是直接删干净，是因为当年这里**缺过** upstream，
    # 导致 /distribute-api/* 落到 SPA fallback、前端把 index.html 当成功解析，
    # 表现为「空列表且无报错」—— 一个只留下"删掉了"而不留下"为什么曾经需要它"的仓库，
    # 很容易在下次重构时重犯同一个错误。

    upstream acceptance_backend {
        zone acceptance_backend 64k;
        server acceptance-backend:9090 resolve;
        keepalive 16;
    }

    # ========== Server 定义 ==========
    server {
        listen       80;
        server_name  localhost;

        # 安全响应头。注意 nginx 的 add_header 不继承：只要 location 内出现任意
        # 一条 add_header，server 级的全部 add_header 都会被丢弃。故所有自带
        # add_header 的 location 都必须再 include 一次同一个 snippet。
        include /etc/nginx/snippets/kms-security-headers.conf;

        # ========== 前端哈希静态资源（内容寻址，可永久强缓存）==========
        # 正则 location 优先于前缀 location，因此 /<app>/assets/* 会先命中这里，
        # 不会走下面的 SPA fallback。
        #
        # 缺失时跳转到 @kms_asset_404 而不是回落 index.html：
        # 一旦用 HTML 冒充 JS，浏览器只会报 "Expected a JavaScript-or-Wasm module
        # script but the server responded with a MIME type of text/html"，
        # 把「某个 chunk 不存在」这个真正的问题完全掩盖掉。
        location @kms_asset_404 {
            include /etc/nginx/snippets/kms-security-headers.conf;
            # 关键：404 绝不能跟着资源一起被强缓存一年。发版切换的瞬间旧 chunk
            # 会短暂 404，若该 404 被 immutable 缓存，用户会长期拿到白屏。
            include /etc/nginx/snippets/kms-spa-no-store.conf;
            return 404;
        }

        location ~* ^/(updatedel|distribute|user|acceptance)/assets/ {
            root /usr/share/nginx/html;
            include /etc/nginx/snippets/kms-security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri @kms_asset_404;
        }

        # ========== kms-generate 路由 ==========
        # 注意：generate-go / updatedel-go 的入站接口仅限内网调用，
        # 不再通过网关对外暴露（原先的 /generate-ingress/、/updatedel-ingress/ 已下架）。
        # 原因：Go 侧凭 X-Kms-User 内部头确定密钥归属，该头只能由 Java 业务层写入；
        # 若对外暴露，攻击者可用泄露的内部 Token 直接伪造身份触达生成/更新/回收。
        # Java 侧经 Docker 网络 generate-go:8081 / updatedel-go:8082 访问。

        # Java 后端 API
        location /generate-api/ {
            proxy_pass http://generate_java_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 前端页面已下线（P5 收敛，见 kms-generate/front/RETIRED.md）。
        # 这里刻意不删干净、而是显式 404，原因：默认 location 的 try_files 会回落
        # /index.html，于是「前端已退役」会表现为 HTTP 200 的门户首页（HTML 冒充），
        # 旧书签会静默加载错页面，且从状态码上完全看不出该应用已不存在。
        # 注意：只下线静态前端；/generate-api/ 与 generate-java / generate-go 后端仍在服务
        #（统一管理端 /updatedel/ 仍在调用公钥查询 / 用户密钥池 / 生成历史）。
        location /generate/ {
            return 404;
        }

        # ========== kms-updatedel 路由 ==========
        # Go 入站层不再对外暴露（原 /updatedel-ingress/ 与 /lifecycle-ingress/ 已下架），
        # 仅允许 Java 业务层经内网 updatedel-go:8082 调用。

        # Java 后端 API
        location /updatedel-api/ {
            proxy_pass http://updatedel_java_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /lifecycle-api/ {
            proxy_pass http://updatedel_java_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 前端页面
        location /updatedel/ {
            alias /usr/share/nginx/html/updatedel/;
            include /etc/nginx/snippets/kms-security-headers.conf;
            include /etc/nginx/snippets/kms-spa-no-store.conf;
            try_files $uri $uri/ /updatedel/index.html;
            index index.html index.htm;
        }

        location /lifecycle/ {
            return 301 /updatedel/;
        }

        location = /pqkds-api/swagger.json {
            proxy_pass http://pqkds_demo_backend/swagger.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /pqkds-api/api/ {
            proxy_pass http://pqkds_demo_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location = /pqkds-api/user/signIn {
            proxy_pass http://pqkds_demo_backend/api/system/user/signIn/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # =====================================================================
        # 关闭分发模块自带的登录入口（P4 第 4 项 / D7）
        # ---------------------------------------------------------------------
        # 这两个端点原本可以直接用账号口令换取**分发模块自己的 JWT**，
        # 而它认的是 `dvadmin_system_users` —— 与主 KMS 的 `kms.sys_user`
        # **是两张不同的表**。也就是说它不只是"第二个入口"，
        # 而是一整套并行的身份体系：谁能登录、谁是管理员，在那边完全另说。
        #
        # D7 明确 `dvadmin_system_users` 退化为"节点侧附属信息"、不再作为登录身份源；
        # D9 又要求"只有一个登录入口，登录后按 role_level 分流"。
        # 只要这两个端点还在，这两条就被绕过了 —— 任何人拿到那边的账号口令，
        # 就能以另一个身份进入系统，而主 KMS 的角色判定完全不参与。
        #
        # 因此这里直接返回 403。**不影响管理端自己那套接口**：
        # 它们的令牌由主 KMS 自省（`kms_service_client.introspect`），
        # 与这两个端点无关。
        #
        # 实测确认过这两个端点是活的（会返回"账号/密码错误"而非 404），
        # 所以这不是"防一个本来就不存在的东西"。
        # =====================================================================
        location = /pqkds-api/api/login/ {
            return 403;
        }

        location = /pqkds-api/api/token/ {
            return 403;
        }

        location = /pqkds-api/user/signOut {
            proxy_pass http://pqkds_demo_backend/api/system/user/signOut/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /pqkds-api/user/ {
            proxy_pass http://pqkds_demo_backend/api/system/user/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /pqkds-api/pqkds/ {
            proxy_pass http://pqkds_demo_backend/api/pqkds/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /pqkds-api/ {
            proxy_pass http://pqkds_demo_backend/api/pqkds/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 分发自带后台（/distribute/）已于 2026-09-26 随代码清理下线。
        #
        # 与 /generate/ 同理：**显式 404**，不能让它回落到默认 location ——
        # 那里的 try_files 会返回 200 的门户首页，等于用 HTML 冒充"这个应用还活着"。
        #
        # 下线依据：管理端「分发与区块链」的三个菜单早已不再 iframe 内嵌它——
        # 9103 在 27_node_management_page.sql 改成原生节点管理页，
        # 9101/9102 在 29_distribution_native_pages.sql 改成原生
        # distOverview/index 与 chain/index（query 均已清空）。
        # 此后没有任何脚本再把 /distribute/ 加回菜单。
        #
        # ⚠️ 注意：只下线**静态前端**。/pqkds-api/ 仍代理到 dvadmin 的 Django 后端，
        # 是管理端节点管理页的数据来源，**不能一起删**。
        location /distribute/ {
            return 404;
        }

        # 旧分发记录查询 API 已随 P5 删除。
        #
        # 这里原先有 `location /distribute-api/ { proxy_pass http://distribute_java_backend/; }`，
        # 指向 kms-distribute Java（8083）+ `kms.key_distribute_record`。
        # 该链路的三个消费方（用户工作台分发图、密钥关联分析分发足迹、check.ps1）
        # 已全部迁到新的批次表，表本身也已删除，因此路由一并移除。
        #
        # 显式返回 404 而不是留空：留空会落到默认 location 的 `try_files`，
        # 于是 `/distribute-api/anything` 会**返回 200 的门户首页 HTML** ——
        # 调用方拿到 200 会以为接口还在，只是数据不对。这与 `/generate/` 退役时踩到的是同一个坑。
        location /distribute-api/ {
            return 404;
        }

        # ========== kms-user 前端路由 ==========
        location /user/ {
            alias /usr/share/nginx/html/user/;
            include /etc/nginx/snippets/kms-security-headers.conf;
            include /etc/nginx/snippets/kms-spa-no-store.conf;
            try_files $uri $uri/ /user/index.html;
            index index.html index.htm;
        }

        # ========== kms-acceptance 路由 ==========
        location /acceptance-api/ {
            proxy_pass http://acceptance_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /acceptance/ {
            alias /usr/share/nginx/html/acceptance/;
            include /etc/nginx/snippets/kms-security-headers.conf;
            include /etc/nginx/snippets/kms-spa-no-store.conf;
            try_files $uri $uri/ /acceptance/index.html;
            index index.html index.htm;
        }

        # ========== 默认路由 (健康检查) ==========
        location / {
            root /usr/share/nginx/html;
            include /etc/nginx/snippets/kms-security-headers.conf;
            include /etc/nginx/snippets/kms-spa-no-store.conf;
            try_files $uri $uri/ /index.html;
            index index.html index.htm;
        }

        location /ping {
            return 200 "KMS Gateway OK";
            add_header Content-Type text/plain;
        }
    }
}
