# KMS-OPS 双系统 Nginx 网关配置
# 路由规则:
#   /generate-ingress/* -> generate-go:8081
#   /generate-api/*     -> generate-java:9081
#   /updatedel-ingress/* -> updatedel-go:8082
#   /updatedel-api/*    -> updatedel-java:9082
#   /generate/*         -> generate-front:80
#   /updatedel/*        -> updatedel-front:80
#   /distribute/*       -> distribute-front:80
#   /pqkds-api/*        -> dvadmin3-django:8000
#   /user/*             -> kms-user-front:80
#   /acceptance/*       -> kms-acceptance-front:80

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 100000;

events {
    worker_connections  20480;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # 关闭访问日志以提升 I/O 性能
    access_log  off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # ========== Upstream 定义 ==========
    # kms-generate 后端
    upstream generate_go_backend {
        zone generate_go_backend 64k;
        server generate-go:8081 resolve;
        keepalive 1000;
    }

    upstream generate_java_backend {
        zone generate_java_backend 64k;
        server generate-java:9081 resolve;
        keepalive 32;
    }

    # kms-updatedel 后端
    upstream updatedel_go_backend {
        zone updatedel_go_backend 64k;
        server updatedel-go:8082 resolve;
        keepalive 1000;
    }

    upstream updatedel_java_backend {
        zone updatedel_java_backend 64k;
        server updatedel-java:9082 resolve;
        keepalive 32;
    }

    upstream distribute_java_backend {
        zone distribute_java_backend 64k;
        server kms-distribute:8083 resolve;
        keepalive 32;
    }

    upstream pqkds_demo_backend {
        zone pqkds_demo_backend 64k;
        server dvadmin3-django:8000 resolve;
        keepalive 32;
    }

    upstream acceptance_backend {
        zone acceptance_backend 64k;
        server acceptance-backend:9090 resolve;
        keepalive 16;
    }

    # ========== Server 定义 ==========
    server {
        listen       80;
        server_name  localhost;

        # 安全响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;

        # ========== kms-generate 路由 ==========
        # Go 后端入口
        location /generate-ingress/ {
            proxy_pass http://generate_go_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
        }

        # Java 后端 API
        location /generate-api/ {
            proxy_pass http://generate_java_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 前端页面
        location /generate/ {
            alias /usr/share/nginx/html/generate/;
            try_files $uri $uri/ /generate/index.html;
            index index.html index.htm;
        }

        # ========== kms-updatedel 路由 ==========
        # Go 后端入口
        location /updatedel-ingress/ {
            proxy_pass http://updatedel_go_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
        }

        location /lifecycle-ingress/ {
            return 301 /updatedel-ingress/;
        }

        # Java 后端 API
        location /updatedel-api/ {
            proxy_pass http://updatedel_java_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /lifecycle-api/ {
            proxy_pass http://updatedel_java_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 前端页面
        location /updatedel/ {
            alias /usr/share/nginx/html/updatedel/;
            try_files $uri $uri/ /updatedel/index.html;
            index index.html index.htm;
        }

        location /lifecycle/ {
            return 301 /updatedel/;
        }

        # ========== kms-distribute API 路由 ==========
        location /distribute-api/ {
            proxy_pass http://distribute_java_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /pqkds-api/ {
            proxy_pass http://pqkds_demo_backend/api/pqkds/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /distribute/ {
            alias /usr/share/nginx/html/distribute/;
            try_files $uri $uri/ /distribute/index.html;
            index index.html index.htm;
        }

        # ========== kms-user 前端路由 ==========
        location /user/ {
            alias /usr/share/nginx/html/user/;
            try_files $uri $uri/ /user/index.html;
            index index.html index.htm;
        }

        # ========== kms-acceptance 路由 ==========
        location /acceptance-api/ {
            proxy_pass http://acceptance_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /acceptance/ {
            alias /usr/share/nginx/html/acceptance/;
            try_files $uri $uri/ /acceptance/index.html;
            index index.html index.htm;
        }

        # ========== 默认路由 (健康检查) ==========
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index index.html index.htm;
        }

        location /ping {
            return 200 "KMS Gateway OK";
            add_header Content-Type text/plain;
        }
    }
}
