# ---------------------------------------------------------------------------
# SPA 入口禁止缓存（snippet，供 include 复用）
# ---------------------------------------------------------------------------
# 适用对象：各前端应用的 index.html 及其同级静态文件（favicon 等）。
# 不含 /assets/ 下的哈希产物——那些由 nginx.conf 中的正则 location 单独处理，
# 走 max-age=31536000 + immutable 强缓存。
#
# 必须 no-store 的原因见 nginx.conf 顶部「前端缓存策略」：入口 HTML 一旦被浏览器
# 启发式缓存，发版后旧 HTML 会去请求已删除的旧 chunk，页面整片报 MIME 错误。
# ---------------------------------------------------------------------------
add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
add_header Pragma "no-cache" always;
# 关掉 expires 派生头，避免与上面的 Cache-Control 冲突（expires off 为默认值，
# 显式写出以防后续有人加上 expires 指令时把 no-store 覆盖掉）。
expires off;
