# ---------------------------------------------------------------------------
# KMS 网关统一安全响应头（snippet，供 include 复用）
# ---------------------------------------------------------------------------
# 为什么要抽成 snippet 而不是只写在 server 块里：
#   nginx 的 add_header 采用「全有或全无」的继承方式——只要某个 location 内
#   出现了哪怕一条 add_header，server 块上的全部 add_header 都会被丢弃。
#   本项目每个前端 location 都要自带 Cache-Control，若不重复 include 本文件，
#   这些页面就会静默失去 X-Frame-Options / nosniff 等防护头。
#   历史上 /distribute/ 就是这个漏洞的实例。
# 因此：任何自带 add_header 的 location 都必须 include 本文件。
# ---------------------------------------------------------------------------
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
