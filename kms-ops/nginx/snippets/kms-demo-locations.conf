# Included only by the canonical Demo origin: http://127.0.0.1:8088.
location = / { return 302 /updatedel/demo; }
location = /demo { return 302 /updatedel/demo$is_args$args; }
location /demo/ { return 302 /updatedel$request_uri; }
location = /standalone { return 404; }
location /standalone/ { return 404; }
location = /updatedel/standalone { return 404; }
location /updatedel/standalone/ { return 404; }
location = /updatedel/login { return 404; }
location /updatedel/login/ { return 404; }
location = /acceptance { return 302 /acceptance/; }
location ~* ^/(updatedel|acceptance)/assets/ {
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/kms-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri @kms_demo_asset_404;
}
location @kms_demo_asset_404 {
    include /etc/nginx/snippets/kms-security-headers.conf;
    include /etc/nginx/snippets/kms-spa-no-store.conf;
    return 404;
}
location /updatedel/ {
    alias /usr/share/nginx/html/updatedel/;
    include /etc/nginx/snippets/kms-security-headers.conf;
    include /etc/nginx/snippets/kms-spa-no-store.conf;
    try_files $uri $uri/ /updatedel/index.html;
}
location /acceptance/ {
    alias /usr/share/nginx/html/acceptance/;
    include /etc/nginx/snippets/kms-security-headers.conf;
    include /etc/nginx/snippets/kms-spa-no-store.conf;
    try_files $uri $uri/ /acceptance/index.html;
}
location = /internal { return 404; }
location /internal/ { return 404; }
location = /demo-api/lifecycle/internal { return 404; }
location /demo-api/lifecycle/internal/ { return 404; }
location = /demo-api/generate/internal { return 404; }
location /demo-api/generate/internal/ { return 404; }
location = /demo-api/pqkds/internal { return 404; }
location /demo-api/pqkds/internal/ { return 404; }
location = /acceptance-api/internal { return 404; }
location /acceptance-api/internal/ { return 404; }
location /demo-api/lifecycle/ {
    proxy_pass http://updatedel_java_backend/;
    include /etc/nginx/snippets/kms-demo-proxy.conf;
}
location /demo-api/generate/ {
    proxy_pass http://generate_java_backend/;
    include /etc/nginx/snippets/kms-demo-proxy.conf;
}
location /demo-api/pqkds/ {
    limit_req zone=kms_node_crypto burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://pqkds_demo_backend/api/pqkds/;
    include /etc/nginx/snippets/kms-demo-proxy.conf;
}
location /acceptance-api/ {
    proxy_pass http://acceptance_backend/api/;
    include /etc/nginx/snippets/kms-demo-proxy.conf;
}
location = /ping { return 200 "KMS Demo Gateway OK"; }
include /etc/nginx/snippets/kms-external-sscl.conf;
# All retired ordinary APIs/static products fail explicitly, no anonymous fallback.
location / { return 404; }
