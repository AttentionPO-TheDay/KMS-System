# External server integration uses its own Bearer credential, with no Demo identity.
location = /external-api/v1/nodes/activate/ {
    client_max_body_size 2k;
    limit_req zone=kms_external_sscl burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://pqkds_demo_backend/external-api/v1/nodes/activate/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Internal-Token "";
    proxy_set_header X-Kms-Entry-Mode "";
    proxy_set_header X-Kms-Demo-Gateway "";
    proxy_set_header X-Kms-Demo-Session "";
    proxy_set_header Cookie "";
    proxy_read_timeout 120s;
}
