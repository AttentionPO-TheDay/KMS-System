# 外部客户端不能把普通网关请求标成 Demo 内部请求。
proxy_set_header X-Kms-Entry-Mode "";
proxy_set_header X-Kms-Demo-Gateway "";
proxy_set_header X-Kms-Demo-Session "";

# `proxy_set_header` 在 location 级别定义后不会继续继承 server 级配置。
# 主 nginx server 虽然设置了 X-Forwarded-Proto，但每个 API location 同时
# 设置 Host/X-Real-IP，导致该头被覆盖掉。Django 因此把 HTTPS 请求误判成
# HTTP，节点初始化会拒绝并提示“非回环独立模式签发必须使用 HTTPS”。
# 这里必须在所有独立模式代理 location 的公共片段中再次明确传递入口协议。
proxy_set_header X-Forwarded-Proto $scheme;
