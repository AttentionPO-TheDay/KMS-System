server:
  port: 8082

spring:
  application:
    name: kms-distribute
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kms?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: password
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: kms-distribute-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

mybatis:
  mapper-locations: classpath:mapper/distribute/*.xml
  type-aliases-package: com.ruoyi.distribute.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

feign:
  okhttp:
    enabled: true
  httpclient:
    enabled: true

# 服务注册与发现
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# 密钥分发系统配置
kms:
  distribute:
    url: http://localhost:8082

logging:
  level:
    com.ruoyi.distribute: DEBUG
