<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PQKDS加密聊天系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* 左侧边栏 */
        .sidebar {
            width: 280px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #e0e0e0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .sidebar-header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .contact-item {
            padding: 12px 16px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .contact-item:hover {
            background: #f5f5f5;
        }

        .contact-item.active {
            background: #f0f0f0;
            border-left-color: #667eea;
        }

        .contact-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
            flex-shrink: 0;
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-status {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }

        /* 主聊天区域 */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .chat-header {
            padding: 16px;
            border-bottom: 1px solid #e0e0e0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header-info h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .chat-header-info p {
            font-size: 12px;
            opacity: 0.9;
        }

        .chat-header-actions {
            display: flex;
            gap: 12px;
        }

        .header-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .header-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* 消息区域 */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #f9f9f9;
        }

        .message-group {
            display: flex;
            gap: 8px;
            margin-bottom: 4px;
            animation: slideIn 0.3s ease;
            align-items: flex-end;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-group.sent {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-width: 55%;
        }

        .message-group.sent .message-content {
            align-items: flex-end;
        }

        .message-bubble {
            padding: 8px 12px;
            border-radius: 18px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
            max-width: 100%;
        }

        .message-group.received .message-bubble {
            background: #e8e8e8;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message-group.sent .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 2px;
            padding: 0 4px;
        }

        .message-status {
            font-size: 10px;
            color: #999;
            margin-top: 1px;
            padding: 0 4px;
        }

        /* 输入区域 */
        .input-area {
            padding: 12px 16px;
            border-top: 1px solid #e0e0e0;
            background: #fff;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .input-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: #f0f0f0;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #e8e8e8;
            transform: scale(1.1);
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
            outline: none;
            transition: all 0.3s ease;
        }

        .message-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            cursor: pointer;
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state-text {
            font-size: 16px;
            margin-bottom: 8px;
        }

        /* 加密指示器 */
        .encryption-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .encryption-badge::before {
            content: '🔒';
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                width: 250px;
            }
            .message-content {
                max-width: 75%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>💬 PQKDS聊天</h1>
                <p>后量子密码学加密通信</p>
            </div>
            <div class="contacts-list" id="contactsList">
                <!-- 联系人列表将动态加载 -->
            </div>
        </div>

        <!-- 主聊天区域 -->
        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-header-info">
                    <h2 id="chatTitle">选择联系人开始聊天</h2>
                    <p id="chatStatus">
                        <span class="encryption-badge">端到端加密</span>
                    </p>
                </div>
                <div class="chat-header-actions">
                    <button class="header-btn" title="语音通话">☎️</button>
                    <button class="header-btn" title="视频通话">📹</button>
                    <button class="header-btn" title="更多选项">⋯</button>
                </div>
            </div>

            <div class="messages-area" id="messagesArea">
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <div class="empty-state-text">选择联系人开始聊天</div>
                    <div style="font-size: 12px; color: #ccc;">所有消息都经过后量子密码学加密</div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-actions">
                    <button class="action-btn" title="添加文件">📎</button>
                    <button class="action-btn" title="表情">😊</button>
                </div>
                <div class="input-wrapper">
                    <textarea class="message-input" id="messageInput" placeholder="输入消息..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn" title="发送">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentChat = null;
        let allNodes = [];
        let currentUserId = 'node_1';
        const API_BASE = '/api/pqkds/chat';
        let messageRefreshInterval = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadNodes();
            setupEventListeners();
        });

        async function loadNodes() {
            try {
                const response = await fetch(`${API_BASE}/nodes/`);
                const data = await response.json();
                if (data.success) {
                    allNodes = data.nodes;
                    renderContacts();
                }
            } catch (error) {
                console.error('加载节点失败:', error);
            }
        }

        function renderContacts() {
            const contactsList = document.getElementById('contactsList');
            contactsList.innerHTML = allNodes.map(node => `
                <div class="contact-item" data-node-id="${node.node_id}" onclick="selectContact('${node.node_id}', '${node.node_name}')">
                    <div class="contact-avatar">${node.node_name.charAt(0).toUpperCase()}</div>
                    <div class="contact-info">
                        <div class="contact-name">${node.node_name}</div>
                        <div class="contact-status">节点ID: ${node.node_id}</div>
                    </div>
                </div>
            `).join('');
        }

        function selectContact(nodeId, nodeName) {
            currentChat = { nodeId, nodeName };

            document.querySelectorAll('.contact-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-node-id="${nodeId}"]`).classList.add('active');

            document.getElementById('chatTitle').textContent = nodeName;
            document.getElementById('chatStatus').innerHTML = `
                <span class="encryption-badge">端到端加密</span>
                <span style="margin-left: 8px; font-size: 12px; color: #999;">节点: ${nodeId}</span>
            `;

            if (messageRefreshInterval) clearInterval(messageRefreshInterval);
            loadMessages();
            messageRefreshInterval = setInterval(loadMessages, 2000);
        }

        async function loadMessages() {
            if (!currentChat) return;

            try {
                const response = await fetch(
                    `${API_BASE}/messages/?sender_id=${currentUserId}&receiver_id=${currentChat.nodeId}&page=1&page_size=50`
                );
                const data = await response.json();
                if (data.success) {
                    renderMessages(data.messages);
                }
            } catch (error) {
                console.error('加载消息失败:', error);
            }
        }

        function renderMessages(messages) {
            const messagesArea = document.getElementById('messagesArea');

            if (messages.length === 0) {
                messagesArea.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <div class="empty-state-text">暂无消息</div>
                        <div style="font-size: 12px; color: #ccc;">开始聊天吧</div>
                    </div>
                `;
                return;
            }

            messagesArea.innerHTML = messages.map(msg => {
                const isSent = msg.sender_id === currentUserId;
                const time = new Date(msg.timestamp).toLocaleTimeString('zh-CN', {
                    hour: '2-digit',
                    minute: '2-digit'
                });

                return `
                    <div class="message-group ${isSent ? 'sent' : 'received'}">
                        ${!isSent ? `<div class="message-avatar">${msg.sender_id.charAt(0).toUpperCase()}</div>` : ''}
                        <div class="message-content">
                            <div class="message-bubble">${escapeHtml(msg.message)}</div>
                            <div class="message-time">${time}</div>
                            ${isSent ? `<div class="message-status">✓✓ 已读</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        async function sendMessage() {
            if (!currentChat) {
                alert('请先选择联系人');
                return;
            }

            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            try {
                const response = await fetch(`${API_BASE}/send-message/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sender_id: currentUserId,
                        receiver_id: currentChat.nodeId,
                        message: message
                    })
                });

                const data = await response.json();
                if (data.success) {
                    input.value = '';
                    input.style.height = 'auto';
                    loadMessages();
                }
            } catch (error) {
                console.error('发送消息失败:', error);
            }
        }

        function setupEventListeners() {
            const sendBtn = document.getElementById('sendBtn');
            const messageInput = document.getElementById('messageInput');

            sendBtn.addEventListener('click', sendMessage);

            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            messageInput.addEventListener('input', () => {
                messageInput.style.height = 'auto';
                messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
