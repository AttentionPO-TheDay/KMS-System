# 项目相关配置
ruoyi:
  name: kms-generate
  version: 1.0.0
  copyrightYear: 2026
  profile: D:/ruoyi/uploadPath
  addressEnabled: false
  captchaType: math

# 开发环境配置
server:
  port: 9081
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 200
      min-spare: 10

# 日志配置
logging:
  level:
    com.ruoyi: INFO
    com.ruoyi.generate.mapper: INFO
    org.springframework: warn
    org.springframework.security.web.firewall: FATAL
    org.springframework.kafka: error
    org.apache.kafka: error
    org.apache.kafka.clients: error

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  application:
    name: kms-generate
  messages:
    basename: i18n/messages
  profiles:
    active: druid
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      # 生产配置中不得开启热重启：会导致类加载器泄漏与不可预期的重启。
      # 如需本地热重载，请使用 spring-boot-devtools 的独立本地 profile。
      enabled: false
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    database: 0
    password: ${REDIS_PASSWORD:}
    timeout: 10s
    lettuce:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 8
        max-wait: -1ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: kms-generate-consumer-group
      # 关闭自动提交：原 auto-commit 会在消息被消费后（而非处理成功后）提交位点，
      # 入库/发链失败的消息也会被确认，造成静默丢失。
      # 配合下方的 listener ack-mode: BATCH，改为整批处理完成后提交。
      enable-auto-commit: false
      auto-commit-interval: 1000
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      type: batch
      concurrency: 6
      # BATCH：整批处理完成后才提交位点，避免未处理成功的消息被确认。
      # 选用 BATCH 而非 MANUAL_IMMEDIATE 的原因：现有监听方法签名接收
      # List<ConsumerRecord> 且未注入 Acknowledgment，MANUAL 模式会导致启动失败。
      ack-mode: BATCH


# token配置
token:
  header: Authorization
  # JWT 签名密钥，必须由环境变量 KMS_TOKEN_SECRET 注入，无默认值。
  # 三个后端（generate/updatedel/distribute）必须使用同一值：
  # 它们共用 Redis 与登录态以便跨服务调用（如 AUTO_UPDATE 权限校验）。
  # 历史上该值硬编码为 "abcdefghijklmnopqrstuvwxyz"，属公开值，可被用于伪造管理员 Token。
  secret: ${KMS_TOKEN_SECRET}
  expireTime: 30

# MyBatis配置
mybatis:
  typeAliasesPackage: com.ruoyi.common.core.domain,com.ruoyi.common.core.domain.entity,com.ruoyi.system.domain,com.ruoyi.quartz.domain,com.ruoyi.generator.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  enabled: true
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*

fisco:
  host: ${FISCO_HOST:fisco-node}
  contract-address: ${FISCO_CONTRACT_ADDRESS:0xadb09744949bbc4096c8b340303dfed763dae2b7}
  private-key: ${FISCO_PRIVATE_KEY:}

kms:
  kafka:
    generate-topic: ${KMS_GENERATE_TOPIC:key_generate_log}
    chain-topic: ${KMS_CHAIN_TOPIC:key_chain_task}
    chain-result-topic: ${KMS_CHAIN_RESULT_TOPIC:key_chain_result}
  # Go 高性能生成服务配置
  go-backend:
    url: ${GO_BACKEND_URL:http://localhost:8081}
    # 内部鉴权 Token，必须与 Go 端 INTERNAL_TOKEN 环境变量一致。
    # 必须由环境变量注入，无默认值（历史默认为公开值，泄露后可触达生成/更新/回收）。
    internal-token: ${INTERNAL_TOKEN}
