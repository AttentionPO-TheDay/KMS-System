# 项目相关配置
ruoyi:
  name: kms-generate
  version: 1.0.0
  copyrightYear: 2026
  profile: D:/ruoyi/uploadPath

# 服务端口配置
server:
  port: 9081
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 200
      min-spare: 10

# 日志配置
logging:
  level:
    com.ruoyi.generate: INFO
    com.ruoyi.generate.mapper: INFO
    org.springframework: WARN
    org.springframework.kafka: ERROR
    org.apache.kafka: ERROR

# Spring配置
spring:
  # 应用名称
  application:
    name: kms-generate

  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/kms?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: root123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # Kafka 配置
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: kms-generate-consumer-group
      enable-auto-commit: true
      auto-commit-interval: 1000
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      type: batch
      concurrency: 6

# MyBatis配置
mybatis:
  type-aliases-package: com.ruoyi.generate.domain
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  config-location: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helper-dialect: mysql
  support-methods-arguments: true
  params: count=countSql

# Swagger配置
swagger:
  enabled: true
  path-mapping: /dev-api

# FISCO BCOS 配置
fisco:
  contract-address: "0xadb09744949bbc4096c8b340303dfed763dae2b7"
