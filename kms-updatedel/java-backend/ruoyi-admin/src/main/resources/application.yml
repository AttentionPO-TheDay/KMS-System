# 项目相关配置
ruoyi:
  name: kms-updatedel
  version: 1.0.0
  copyrightYear: 2026
  profile: ${RUOYI_PROFILE:D:/ruoyi/uploadPath}
  addressEnabled: false
  captchaType: math

server:
  port: 9082
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

logging:
  level:
    com.ruoyi: INFO
    com.ruoyi.updatedel: INFO
    org.springframework: warn
    org.springframework.security.web.firewall: FATAL
    org.springframework.kafka: error
    org.apache.kafka: error
    org.apache.kafka.clients: error

user:
  password:
    maxRetryCount: 5
    lockTime: 10

spring:
  application:
    name: kms-updatedel
  messages:
    basename: i18n/messages
  profiles:
    active: druid
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      enabled: true
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    database: 0
    password: ${REDIS_PASSWORD:}
    timeout: 10s
    lettuce:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 8
        max-wait: -1ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: kms-updatedel-consumer-group
      auto-offset-reset: latest
      enable-auto-commit: true
      auto-commit-interval: 1000
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

token:
  header: Authorization
  secret: abcdefghijklmnopqrstuvwxyz
  expireTime: 30

mybatis:
  typeAliasesPackage: com.ruoyi.common.core.domain,com.ruoyi.common.core.domain.entity,com.ruoyi.system.domain,com.ruoyi.quartz.domain,com.ruoyi.generator.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

swagger:
  enabled: true
  pathMapping: /dev-api

xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*

kms:
  go-backend:
    url: ${GO_BACKEND_URL:http://updatedel-go:8082}
    internal-token: ${INTERNAL_TOKEN:kms-generate-internal-secret-2026}
  lifecycle:
    kafka:
      update-topic: key_update_log
      revoke-topic: key_revoke_log
      chain-task-topic: key_chain_task
      chain-result-topic: ${KMS_CHAIN_RESULT_TOPIC:key_chain_result}

fisco:
  host: ${FISCO_HOST:fisco-node}
  contract-address: ${FISCO_CONTRACT_ADDRESS:0xadb09744949bbc4096c8b340303dfed763dae2b7}
  private-key: ${FISCO_PRIVATE_KEY:}
