# 项目相关配置
ruoyi:
  name: kms-updatedel
  version: 1.0.0
  copyrightYear: 2026
  profile: ${RUOYI_PROFILE:D:/ruoyi/uploadPath}
  addressEnabled: false
  captchaType: math

server:
  port: 9082
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

logging:
  level:
    com.ruoyi: INFO
    com.ruoyi.updatedel: INFO
    com.ruoyi.updatedel.consumer.LifecycleKafkaConsumer: ${KMS_LIFECYCLE_LOG_LEVEL:WARN}
    com.ruoyi.updatedel.service.LifecycleService: ${KMS_LIFECYCLE_LOG_LEVEL:WARN}
    com.ruoyi.updatedel.consumer.UpdatedelChainConsumer: ${KMS_LIFECYCLE_CHAIN_LOG_LEVEL:WARN}
    com.ruoyi.updatedel.service.UpdatedelChainService: ${KMS_LIFECYCLE_CHAIN_LOG_LEVEL:WARN}
    org.springframework: warn
    org.springframework.security.web.firewall: FATAL
    org.springframework.kafka: error
    org.apache.kafka: error
    org.apache.kafka.clients: error

user:
  password:
    maxRetryCount: 5
    lockTime: 10

spring:
  application:
    name: kms-updatedel
  messages:
    basename: i18n/messages
  profiles:
    active: druid
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      # 生产配置中不得开启热重启：会导致类加载器泄漏与不可预期的重启。
      enabled: false
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    database: 0
    password: ${REDIS_PASSWORD:}
    timeout: 10s
    lettuce:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 8
        max-wait: -1ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: kms-updatedel-consumer-group
      # earliest：本系统的核心动作是「回收」，丢一条回收消息意味着密钥未真正失效。
      # 原 latest 会在消费者离线期间静默跳过消息，对回收语义是不可接受的。
      auto-offset-reset: earliest
      # 关闭自动提交：原 auto-commit 会在消息被消费后（而非处理成功后）提交位点，
      # 导致处理失败的消息也被确认并静默丢失。
      # 配合 listener ack-mode: BATCH，改为整批处理完成后提交。
      enable-auto-commit: false
      auto-commit-interval: 1000
      max-poll-records: ${KMS_LIFECYCLE_MAX_POLL_RECORDS:1000}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: ${KMS_LIFECYCLE_MAX_POLL_INTERVAL_MS:600000}
        fetch.min.bytes: ${KMS_LIFECYCLE_FETCH_MIN_BYTES:1048576}
        fetch.max.wait.ms: ${KMS_LIFECYCLE_FETCH_MAX_WAIT_MS:100}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      type: batch
      # BATCH：整批处理完成后才提交位点。现有监听方法签名接收
      # List<ConsumerRecord> 且未注入 Acknowledgment，无法直接使用 MANUAL_IMMEDIATE。
      ack-mode: BATCH

token:
  header: Authorization
  # JWT 签名密钥，必须由环境变量 KMS_TOKEN_SECRET 注入，无默认值。
  # 三个后端必须使用同一值（共用 Redis 与登录态以支持跨服务调用）。
  # 历史上硬编码为 "abcdefghijklmnopqrstuvwxyz"，属公开值，可被用于伪造管理员 Token。
  secret: ${KMS_TOKEN_SECRET}
  expireTime: 30

mybatis:
  typeAliasesPackage: com.ruoyi.common.core.domain,com.ruoyi.common.core.domain.entity,com.ruoyi.system.domain,com.ruoyi.quartz.domain,com.ruoyi.generator.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

swagger:
  enabled: true
  pathMapping: /dev-api

xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*,/lifecycle/*

kms:
  go-backend:
    url: ${GO_BACKEND_URL:http://updatedel-go:8082}
    # 必须由环境变量注入，无默认值（历史默认为公开值，泄露后可触达生成/更新/回收）。
    internal-token: ${INTERNAL_TOKEN}
  lifecycle:
    batch-size: ${KMS_LIFECYCLE_BATCH_SIZE:500}
    chain-sync-enabled: ${KMS_LIFECYCLE_CHAIN_SYNC_ENABLED:true}
    chain-consumer-enabled: ${KMS_LIFECYCLE_CHAIN_CONSUMER_ENABLED:true}
    chain-event-batch-size: ${KMS_LIFECYCLE_CHAIN_EVENT_BATCH_SIZE:500}
    chain-consumer-concurrency: ${KMS_LIFECYCLE_CHAIN_CONSUMER_CONCURRENCY:2}
    chain-worker-threads: ${KMS_LIFECYCLE_CHAIN_WORKER_THREADS:4}
    chain-batch-size: ${KMS_LIFECYCLE_CHAIN_BATCH_SIZE:20}
    chain-max-poll-records: ${KMS_LIFECYCLE_CHAIN_MAX_POLL_RECORDS:10}
    chain-max-poll-interval-ms: ${KMS_LIFECYCLE_CHAIN_MAX_POLL_INTERVAL_MS:900000}
    chain-failure-sample-size: ${KMS_LIFECYCLE_CHAIN_FAILURE_SAMPLE_SIZE:5}
    chain-detail-log-enabled: ${KMS_LIFECYCLE_CHAIN_DETAIL_LOG_ENABLED:false}
    kafka:
      update-topic: key_update_log
      revoke-topic: key_revoke_log
      consumer-concurrency: ${KMS_LIFECYCLE_CONSUMER_CONCURRENCY:6}
      chain-task-topic: ${KMS_CHAIN_TOPIC:key_chain_task}
      chain-result-topic: ${KMS_CHAIN_RESULT_TOPIC:key_chain_result}

fisco:
  host: ${FISCO_HOST:fisco-node}
  contract-address: ${FISCO_CONTRACT_ADDRESS:0xadb09744949bbc4096c8b340303dfed763dae2b7}
  private-key: ${FISCO_PRIVATE_KEY:}
